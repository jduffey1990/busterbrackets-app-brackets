# Mirrors the checks pinned in .no-mistakes.yaml so the gate's CI step has real
# GitHub checks to monitor. Generated by `no-mistakes ci-workflow`, then edited:
# the generator guessed a Go toolchain and omitted dependency install.
name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --prefer-offline

      - name: Lint
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --ci
